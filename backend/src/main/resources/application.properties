# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Info
spring.application.name=farmer-production-tracking-backend


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-39d7e485-farmer-production-tracking.e.aivencloud.com:21627/defaultdb?sslMode=REQUIRED&tcpKeepAlive=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# HikariCP Connection Pool (Optimized for Aiven Cloud MySQL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=45000
spring.datasource.hikari.max-lifetime=58000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / Springdoc OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.farmer.tracking=DEBUG
logging.level.org.hibernate.SQL=INFO

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
