# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Info
spring.application.name=farmer-production-tracking-backend

# Auto-import gitignored .env file if present
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===================================================================
# Database Configuration (Injected dynamically from .env or environment variables:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-39d7e485-farmer-production-tracking.e.aivencloud.com:21627/defaultdb?sslMode=REQUIRED&tcpKeepAlive=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (Optimized for Aiven Cloud MySQL)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=45000
spring.datasource.hikari.max-lifetime=58000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000

# JPA & Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Swagger / Springdoc OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.farmer.tracking=DEBUG
logging.level.org.hibernate.SQL=INFO

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google sign-in (OAuth 2.0 authorization-code flow). Leave empty to disable the button.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Administration console
# Comma-separated emails that become ROLE_ADMIN when they sign in with Google (verified email only).
app.admin.emails=${ADMIN_EMAILS:}
# Optional: create/promote an admin account at startup (email + password sign-in).
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap-name=${ADMIN_BOOTSTRAP_NAME:Platform Admin}

# ===================================================================
# Mail / SMTP Configuration (set via .env or environment variables)
# MAIL_HOST      — SMTP host  (e.g. smtp.gmail.com)
# MAIL_PORT      — SMTP port  (e.g. 587 for TLS)
# MAIL_USERNAME  — sender address (e.g. noreply@acrea.app)
# MAIL_PASSWORD  — app-password or SMTP password
# MAIL_FROM      — display "From" address shown in inbox
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@acrea.app}}

# ===================================================================
# File Upload — Avatar Photos
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Directory where avatar uploads are stored (relative to backend working dir)
app.uploads.dir=${UPLOADS_DIR:./uploads/avatars}
# Public base URL used to build the avatar URL returned to the client
app.base-url=${APP_BASE_URL:http://localhost:8080}
